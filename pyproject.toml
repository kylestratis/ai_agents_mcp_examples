[project]
name = "ai-agents-mcp-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "mcp[cli]>=2.0.0b1",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.0",
    "starlette>=0.48.0",
    "uvicorn>=0.38.0",
]

[tool.ruff]
line-length = 85

[tool.uv]
prerelease = "allow"

# 2.0.0b1 on PyPI predates the Resolve helpers for sampling and roots
# (Sample, ListRoots). Pin to the audited SDK rev until the next beta or
# the stable release lands, then remove these sources.
[tool.uv.sources]
mcp = { git = "https://github.com/modelcontextprotocol/python-sdk", rev = "1216c53" }
mcp-types = { git = "https://github.com/modelcontextprotocol/python-sdk", rev = "1216c53", subdirectory = "src/mcp-types" }
